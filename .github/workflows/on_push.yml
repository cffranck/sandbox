name: Simple CPP Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest 
    uses: ./.github/workflows/on_call.yml
    steps:
      - run: echo "The event type is ${{ github.event_name }}"
      - uses: actions/checkout@v7
      - run: rm -rf build
      - run: bash ./scripts/build.sh
      - run: build/test_myfun
      - run: echo $?
      - run: build/helloworld
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' }}
        with:
          name: application
          path: ./build/helloworld
