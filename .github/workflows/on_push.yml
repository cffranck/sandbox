name: Simple CPP Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v7
      - run: rm -rf build
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: build/test_myfun
      - run: build/helloworld
